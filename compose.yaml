services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      WA_URL: http://whatsapp:3001
    ports:
      - "0.0.0.0:8787:8000"
    volumes:
      - ./data/app:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  whatsapp:
    build: ./whatsapp
    restart: unless-stopped
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Run scripts/setup.py first}
      APP_URL: http://app:8000
      DATA_DIR: /data
    volumes:
      - ./data/whatsapp:/data
    depends_on:
      app:
        condition: service_healthy
