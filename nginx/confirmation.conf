# Host Nginx: install in an included http configuration directory.
# Replace ack.example.com and both certificate paths before reloading.
# No default_server: preserve the host existing virtual hosts.
server {
    listen 443 ssl;
    server_name ack.example.com;

    ssl_certificate /etc/letsencrypt/live/ack.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ack.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;

    # Published app port on this host; dashboard access stays behind Tailscale/firewall.
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /confirm {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass http://127.0.0.1:8787/confirm;
    }

    location = /confirm/client.js {
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:8787/confirm/client.js;
    }

    # Never expose the dashboard, management API, or internal bridge API.
    location / {
        return 404;
    }
}
