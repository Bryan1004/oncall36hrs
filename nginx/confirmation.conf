# Replace ack.example.com with your public confirmation domain.
# This file is mounted as the ONLY conf.d configuration.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 404;
}

server {
    listen 443 ssl;
    server_name ack.example.com;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;

    # Docker DNS: refresh the app address after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $confirmation_app app:8000;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /confirm {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass http://$confirmation_app/confirm;
    }

    location = /confirm/client.js {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$confirmation_app/confirm/client.js;
    }

    # Never expose the dashboard, management API, or internal bridge API.
    location / {
        return 404;
    }
}
