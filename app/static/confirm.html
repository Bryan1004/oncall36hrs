<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>警报已确认 · On Call 36 小时</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131815" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/confirm/style.css">
  <script src="/confirm/client.js" defer></script>
</head>
<body class="state-loading">
  <div class="container">
    <div class="brand-tag">
      <span class="brand-icon">◉</span>
      <span>On Call 36 小时 · 警报回执</span>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="status-icon-wrap" id="icon-wrap">
          <div class="radar-beacon" id="icon-loading">
            <div class="radar-pulse-ring"></div>
            <div class="radar-pulse-ring delay"></div>
            <div class="radar-center-spinner"></div>
          </div>
          <svg class="icon-svg" id="icon-success" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden>
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <svg class="icon-svg" id="icon-error" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden>
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <svg class="icon-svg" id="icon-warn" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>

        <h1 id="status">正在确认收到…</h1>
        <p id="detail">连接服务器后，将自动标记本轮消息为已收到并停止重复提醒。</p>
        
        <div id="confirmed-time" class="meta-time">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="time-text"></span>
        </div>
      </div>

      <div class="card-footer">
        <div class="actions">
          <button id="retry" class="btn btn-primary" hidden>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            重试确认
          </button>
          <a id="dashboard-link" class="btn btn-primary" href="/">
            打开管理面板
            <span style="font-family: system-ui; font-size: 13px;">→</span>
          </a>
        </div>

        <p class="card-footer-tip">收到回执后，您可以安全关闭此页面</p>
      </div>
    </div>

    <!-- 预览与快速效果演示栏：仅在本地 file:// 预览模式下激活，线上自动隐藏 -->
    <div class="preview-bar" id="preview-bar" hidden>
      <button type="button" data-state="loading">正在确认</button>
      <button type="button" class="active" data-state="success">确认成功</button>
      <button type="button" data-state="error">失败/重试</button>
      <button type="button" data-state="notoken">无链接</button>
    </div>
  </div>
</body>
</html>
